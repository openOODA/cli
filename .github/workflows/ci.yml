name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cli
        uses: actions/checkout@v4
        with:
          path: cli

      - name: Checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std

      - name: Checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar

      - name: Checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang
          mkdir -p "$HOME/.openooda/bin" "$HOME/.openooda/lib"
          GH=https://github.com/openOODA
          # Pinned toolchain: every artifact hash-verified before use (a
          # replaced release asset fails closed). Bump version + hash
          # together, deliberately. A stale liboodar pin fails loudly at
          # link time, never silently.
          OODAC_SHA256="08474a9a05815854295332fc027b1e06150200aa4cfdfbffd3d175290e66dddb"
          curl -fsSL -o "$HOME/.openooda/bin/oodac" \
            "$GH/oodac/releases/download/v0.2.99/oodac-linux-x86_64"
          echo "$OODAC_SHA256  $HOME/.openooda/bin/oodac" | sha256sum -c -
          chmod +x "$HOME/.openooda/bin/oodac"
          OODAR_SHA256="eddc7af6ab6ca84add83247f4ababd3f395cced0cf69de354c07398b97de7e60"
          curl -fsSL -o "$HOME/.openooda/lib/liboodar.a" \
            "$GH/oodar/releases/download/v4.0.65/liboodar.a-linux-x86_64"
          echo "$OODAR_SHA256  $HOME/.openooda/lib/liboodar.a" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/oodar/lib"
          cp -f "$HOME/.openooda/lib/liboodar.a" "$GITHUB_WORKSPACE/oodar/lib/liboodar.a"
          NORTHSTAR_SHA="adfd86a19e4e471c4e82578c6696fe4a08b4100e"
          NORTHSTAR_SHA256="eb3e36e9154220418f9d37dce2414ebaf3d39f7755967e6114ad1670be704ea3"
          curl -fsSL -o "$HOME/.openooda/northstar.oot" \
            "https://raw.githubusercontent.com/openOODA/openOODA/${NORTHSTAR_SHA}/northstar.oot"
          echo "$NORTHSTAR_SHA256  $HOME/.openooda/northstar.oot" | sha256sum -c -
          echo "$HOME/.openooda/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.openooda/bin/oodac"
          test -f "$GITHUB_WORKSPACE/std/fs/process/env.oo"
          test -f "$GITHUB_WORKSPACE/oodac/lex/oodac_fmt.oo"

      - name: 256-line cap check
        working-directory: cli
        run: |
          set -e
          violations=0
          for f in $(find . -name "*.oo" -o -name "*.oot"); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 256 ]; then
              echo "FAIL: $f has $lines lines (> 256)"
              violations=$((violations + 1))
            fi
          done
          if [ "$violations" -gt 0 ]; then exit 1; fi
          echo "PASS: 256-line cap holds"

      - name: File-type ban check
        working-directory: cli
        run: |
          set -e
          forbidden="py js ts rb pl json sh"
          for ext in $forbidden; do
            found=$(find . -name "*.$ext" -not -path "./.git/*" | grep -v "^./README.md$" || true)
            if [ -n "$found" ]; then echo "FAIL: .$ext"; echo "$found"; exit 1; fi
          done
          echo "PASS: no forbidden file types"

      - name: Academy header check
        working-directory: cli
        run: |
          set -e
          failures=0
          for f in $(find . -name "*.oo"); do
            header=$(head -7 "$f")
            ok=1
            echo "$header" | grep -q "^// # " || ok=0
            echo "$header" | grep -q "^// Logline:" || ok=0
            echo "$header" | grep -q "^// Setup:" || ok=0
            echo "$header" | grep -q "^// Beats:" || ok=0
            if [ "$ok" -eq 0 ]; then echo "FAIL: $f academy"; failures=$((failures + 1)); fi
          done
          if [ "$failures" -gt 0 ]; then exit 1; fi
          echo "PASS: academy headers"

      - name: oodac check
        working-directory: cli
        env:
          OO_LIST_AMBIENT_QUOTA: "1073741824"
        run: |
          set -e
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          # NOTE: no OODA_STD — oodac ignores it. std/ imports resolve by
          # workspace path walk (oodac ast/load_import_parse.oo).
          unset OODA_FS_READDIR OODA_FS_WRITEDIR || true
          export OODA_NO_JAIL=1
          mkdir -p .ooda-cache/ooda-tmp
          "$OODA_COMPILER" check main.oo
          "$OODA_COMPILER" check qa/build/probe_compiler_token.oo
          echo "PASS: oodac check"

      - name: find_compiler no-fallback (anchor OODA_COMPILER-only)
        working-directory: cli
        run: |
          set -e
          ! grep -q "bin/oodac" build/find_compiler.oo || { echo "ERR find_compiler fallback"; exit 1; }
          ! grep -q "ooda/oodac_bin" build/find_compiler.oo || { echo "ERR find_compiler fallback"; exit 1; }
          echo "PASS: find_compiler OODA_COMPILER-only"

      - name: Build
        working-directory: cli
        run: |
          set -euo pipefail
          export OO_LIST_AMBIENT_QUOTA=1073741824
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          unset OODA_FS_READDIR OODA_FS_WRITEDIR || true
          export OODA_NO_JAIL=1
          mkdir -p dist .ooda-cache/ooda-tmp
          "$OODA_COMPILER" build main.oo -o dist/cli
          chmod +x dist/cli
          cp -a dist/cli dist/cli-linux-x86_64
          sha256sum dist/cli-linux-x86_64 | awk '{print $1}' > dist/cli-linux-x86_64.sha256
          ls -la dist/

      - name: Smoke test
        working-directory: cli
        run: |
          set -e
          ./dist/cli --help | grep -q update
          ./dist/cli --help | grep -q -- --check
          ./dist/cli version | grep -q "v$(cat VERSION)"
          set +e
          ./dist/cli unknown-verb >/dev/null 2>&1
          rc=$?
          ./dist/cli update --bogus >/dev/null 2>&1
          urc=$?
          set -e
          test "$rc" -eq 2
          test "$urc" -eq 2
          echo "PASS: smoke"

      - name: QA suite
        working-directory: cli
        env:
          OO_LIST_AMBIENT_QUOTA: "1073741824"
        run: |
          set -euo pipefail
          export OODACODEX="$HOME/.openooda/northstar.oot"
          export OODA_COMPILER="$HOME/.openooda/bin/oodac"
          unset OODA_FS_READDIR OODA_FS_WRITEDIR || true
          export OODA_NO_JAIL=1
          ./dist/cli qa
          echo "PASS: qa suite"

      - name: Landlock-update-bypass sentinel
        working-directory: cli
        run: |
          set -e
          if ! strings dist/cli | grep -q OK_LANDLOCK_UPDATE_BYPASS; then
            echo "FAIL: cli binary missing OK_LANDLOCK_UPDATE_BYPASS sentinel"
            echo "      cli was built against oodar < v4.0.29; update's bash child"
            echo "      would inherit Landlock and fail curl/sha256/getent."
            exit 1
          fi
          echo "PASS: OK_LANDLOCK_UPDATE_BYPASS sentinel present"

      - name: cli update --check smoke
        working-directory: cli
        run: |
          set -e
          output=$(./dist/cli update --check 2>&1 || true)
          if echo "$output" | grep -q '/dev/null: Permission denied'; then
            echo "FAIL: cli update --check emits /dev/null: Permission denied"
            echo "$output" | grep '/dev/null: Permission denied' | head -5
            exit 1
          fi
          if ! echo "$output" | grep -q 'DIGEST'; then
            echo "FAIL: cli update --check did not produce the hash report"
            echo "$output" | tail -20
            exit 1
          fi
          echo "PASS: cli update --check runs without landlock errors"
          echo "$output" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: |
            cli/dist/cli-linux-x86_64
            cli/dist/cli-linux-x86_64.sha256

  release:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.44
    with:
      artifact_pattern: cli-*
    permissions:
      contents: write
